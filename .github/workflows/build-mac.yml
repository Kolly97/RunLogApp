# Baut den macOS-Installer (.dmg) auf einem macOS-Runner und hängt ihn ans GitHub-Release.
# Auslöser: Push eines Tags v* (z. B. `git tag v1.1.0 && git push origin v1.1.0`).
# Manueller Start ebenfalls möglich (workflow_dispatch) — dann nur Artefakt, kein Release-Upload.
name: Build Mac Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # nötig, um die .dmg ans Release zu hängen

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build + esbuild-Bundle + electron-builder --mac (DMG). Signierung bewusst aus (kein Apple-Zertifikat).
      - name: Build macOS installer
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunLog-Mac-Installer
          path: release/*.dmg
          if-no-files-found: error

      # Nur bei Tag-Push: Installer ans zugehörige GitHub-Release anhängen.
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
