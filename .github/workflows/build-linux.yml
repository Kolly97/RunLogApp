# Baut die Linux-Pakete (AppImage + .deb) auf einem Ubuntu-Runner und hängt sie ans GitHub-Release.
# Auslöser: Push eines Tags v* (z. B. `git tag v1.0.0 && git push origin v1.0.0`).
# Manueller Start ebenfalls möglich (workflow_dispatch) — dann nur Artefakt, kein Release-Upload.
name: Build Linux Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # nötig, um die Pakete ans Release zu hängen

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build + esbuild-Bundle + electron-builder --linux (AppImage + deb).
      - name: Build Linux packages
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packages as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunLog-Linux-Packages
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      # Nur bei Tag-Push: Pakete ans zugehörige Release anhängen (Release wird bei Bedarf angelegt).
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
